<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayume Convites</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f8f5f0;
      color: #292722;
    }

    header {
      text-align: center;
      padding: 45px 20px 30px;
    }

    .logo {
      font-size: 42px;
      letter-spacing: 5px;
      font-weight: normal;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 5px;
      margin-top: 8px;
      text-transform: uppercase;
      color: #77716a;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 20px 40px;
    }

    .category {
      border: 1px solid #cfc7bc;
      background: transparent;
      padding: 11px 18px;
      border-radius: 30px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
    }

    .category:hover {
      background: #e8e1d7;
    }

    .catalog {
      max-width: 1050px;
      margin: auto;
      padding: 0 25px 60px;
    }

    .invitation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
      margin-bottom: 70px;
    }

    .invitation img {
      width: 100%;
      max-width: 480px;
      display: block;
      margin: auto;
      border-radius: 4px;
    }

    .info {
      padding: 20px;
    }

    .info small {
      font-family: Arial, sans-serif;
      color: #9a8f82;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 11px;
    }

    .info h2 {
      font-size: 32px;
      font-weight: normal;
      margin: 12px 0 18px;
    }

    .info p {
      font-family: Arial, sans-serif;
      color: #66615b;
      line-height: 1.7;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .choose {
      display: inline-block;
      padding: 14px 25px;
      background: #292722;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      border-radius: 2px;
    }

    .choose:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid #ddd5cb;
      font-family: Arial, sans-serif;
      color: #8a837b;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .logo {
        font-size: 34px;
      }

      .invitation {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .info {
        padding: 10px 5px 30px;
      }

      .info h2 {
        font-size: 27px;
      }
    }
  </style></head><body>  <header>
    <div class="logo">AYUME</div>
    <div class="subtitle">Convites</div>
  </header>  <nav class="categories">
    <button class="category">WhatsApp</button>
    <button class="category">Infantil Menina</button>
    <button class="category">Infantil Menino</button>
    <button class="category">15 Anos</button>
    <button class="category">Save the Date</button>
  </nav>  <main class="catalog"><section class="invitation">

  <div>
    <img src="Homem Aranha _20261001_180828_0000.png"
     alt="Convite Homem Aranha">
  </div>

  <div class="info">
    <small>Infantil • 1 ano</small>

    <h2>Jardim Encantado</h2>

    <p>
      Um convite delicado e encantador criado para celebrar
      momentos especiais com beleza e personalidade.
    </p>

    <a class="choose"
       href="https://wa.me/5500000000000?text=Olá!%20Gostaria%20de%20escolher%20o%20convite%20Jardim%20Encantado."
       target="_blank">
      ESCOLHER ESSE CONVITE
    </a>
  </div>

</section>

  </main>  <footer>
    Ayume Convites
  </footer></body>
</html>
