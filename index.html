<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayume Convites</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --azul: #527eac;
    --azul-claro: #a9bfd2;
    --fundo: #fbfaf6;
    --texto: #52708f;
    --borda: #a9bfd2;
    --branco: #ffffff;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--fundo);
    color: var(--texto);
}

/* =========================
   PÁGINA INICIAL
========================= */

.home {
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 5vh 7vw;
}

.logo {
    text-align: center;
    margin-bottom: 4vh;
}

.logo h1 {
    font-size: clamp(54px, 12vw, 92px);
    font-weight: 400;
    letter-spacing: -2px;
    color: var(--azul);
    line-height: 0.95;
}

.logo span {
    display: block;
    margin-top: 14px;

    font-family: Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 9px;
    text-transform: lowercase;

    color: var(--azul);
}

/* LISTA */

.categorias {
    width: min(560px, 100%);
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.categoria {
    width: 100%;
    min-height: 66px;

    border: 1px solid var(--borda);
    border-radius: 18px;

    background: rgba(255,255,255,0.5);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px 22px;

    font-family: Arial, sans-serif;
    font-size: 18px;
    letter-spacing: 0.5px;

    color: var(--azul);

    cursor: pointer;
    transition: all .25s ease;
}

.categoria:hover {
    transform: translateY(-2px);
    background: white;
}

.categoria.whatsapp {
    background: var(--azul);
    color: white;
    border-color: var(--azul);
}

.categoria.whatsapp:hover {
    background: #456f9b;
}

/* =========================
   CATÁLOGO
========================= */

.catalogo {
    display: none;
    min-height: 100vh;
    padding: 35px 5vw 60px;
}

.catalogo.ativo {
    display: block;
}

.voltar {
    border: none;
    background: transparent;

    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;

    color: var(--azul);

    cursor: pointer;

    margin-bottom: 55px;
}

.cabecalho-catalogo {
    text-align: center;
    max-width: 800px;
    margin: 0 auto 45px;
}

.cabecalho-catalogo .categoria-titulo {
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;

    color: var(--azul);
    margin-bottom: 16px;
}

.cabecalho-catalogo h2 {
    font-size: clamp(40px, 6vw, 62px);
    font-weight: 400;
    color: var(--azul);
    margin-bottom: 16px;
}

.cabecalho-catalogo p {
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: #71869b;
}

/* =========================
   CARD DO CONVITE
========================= */

.lista-convites {
    max-width: 1100px;
    margin: auto;

    display: flex;
    flex-direction: column;
    gap: 30px;
}

.convite-card {
    background: rgba(255,255,255,0.7);

    border: 1px solid #e1e4e1;
    border-radius: 28px;

    padding: 28px;

    display: grid;
    grid-template-columns: minmax(260px, 42%) 1fr;
    gap: 45px;

    box-shadow: 0 10px 35px rgba(50,70,90,0.06);
}

/* IMAGEM */

.convite-visual {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.celular {
    position: relative;
    width: 270px;
    height: 540px;
    background: #111;
    border: 7px solid #171717;
    border-radius: 38px;
    padding: 8px;
    box-shadow: 0 18px 40px rgba(30, 50, 70, 0.20);
}

.tela {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 29px;
    background: #f5f5f5;
    position: relative;
}

.tela img,
.tela video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.camera {
    position: absolute;
    z-index: 5;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 20px;
    background: #050505;
    border-radius: 20px;
}

.visual-botoes {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.visual-btn {
    border: 1px solid var(--borda);
    background: white;
    color: var(--azul);
    border-radius: 25px;
    padding: 9px 16px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
}

.visual-btn.ativo {
    background: var(--azul);
    color: white;
    border-color: var(--azul);
        }

/* INFORMAÇÕES */

.convite-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.etiqueta {
    display: inline-block;

    width: fit-content;

    background: #edf2f5;
    color: var(--azul);

    padding: 9px 17px;
    border-radius: 30px;

    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;

    margin-bottom: 20px;
}

.convite-info h3 {
    font-size: clamp(30px, 4vw, 48px);
    font-weight: 400;
    color: var(--azul);

    margin-bottom: 25px;
}

.recursos {
    border-top: 1px solid #dce2e5;
    border-bottom: 1px solid #dce2e5;

    padding: 22px 0;

    margin-bottom: 25px;
}

.recursos p {
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: #667c90;

    margin: 11px 0;
}

.recursos p::before {
    content: "✓";
    margin-right: 12px;
    color: var(--azul);
    font-weight: bold;
}

/* BOTÃO */

.escolher {
    width: 100%;

    border: none;
    border-radius: 40px;

    background: var(--azul);
    color: white;

    padding: 17px 25px;

    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;

    cursor: pointer;

    transition: .25s;
}

.escolher:hover {
    background: #456f9b;
    transform: translateY(-2px);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .home {
        padding: 6vh 8vw;
    }

    .logo {
        margin-bottom: 4vh;
    }

    .logo h1 {
        font-size: 58px;
    }

    .logo span {
        font-size: 13px;
        letter-spacing: 7px;
    }

    .categorias {
        gap: 11px;
    }

    .categoria {
        min-height: 58px;
        font-size: 16px;
        border-radius: 17px;
    }

    .catalogo {
        padding: 25px 18px 45px;
    }

    .voltar {
        margin-bottom: 35px;
    }

    .cabecalho-catalogo {
        margin-bottom: 30px;
    }

    .cabecalho-catalogo .categoria-titulo {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .cabecalho-catalogo h2 {
        font-size: 38px;
    }

    .cabecalho-catalogo p {
        font-size: 14px;
    }

    .convite-card {
        grid-template-columns: 43% 57%;
        gap: 15px;
        padding: 15px;
        border-radius: 22px;
    }

    .convite-imagem {
        min-height: 360px;
    }

    .convite-imagem img {
        max-height: 390px;
    }

    .convite-info {
        padding-right: 5px;
    }

    .etiqueta {
        font-size: 8px;
        padding: 7px 9px;
        margin-bottom: 12px;
    }

    .convite-info h3 {
        font-size: 24px;
        margin-bottom: 15px;
    }

    .recursos {
        padding: 12px 0;
        margin-bottom: 15px;
    }

    .recursos p {
        font-size: 11px;
        margin: 8px 0;
    }

    .recursos p::before {
        margin-right: 6px;
    }

    .escolher {
        font-size: 10px;
        padding: 13px 8px;
    }
}

</style>
</head>


<body>

<!-- =========================
     PÁGINA INICIAL
========================= -->

<section class="home" id="home">

    <div class="logo">

        <h1>Ayume</h1>

        <span>convites</span>

    </div>


    <div class="categorias">

        <button
            class="categoria whatsapp"
            onclick="abrirWhatsAppGeral()">
            Fale comigo pelo WhatsApp
        </button>


        <button
            class="categoria"
            onclick="abrirCatalogo('menina')">
            Catálogo Infantil Menina
        </button>


        <button
            class="categoria"
            onclick="abrirCatalogo('menino')">
            Catálogo Infantil Menino
        </button>


        <button
            class="categoria"
            onclick="abrirCatalogo('15anos')">
            Catálogo 15 anos
        </button>


        <button
            class="categoria"
            onclick="abrirCatalogo('adulto')">
            Catálogo Adulto
        </button>


        <button
            class="categoria"
            onclick="abrirCatalogo('fotos')">
            Álbum de Fotos
        </button>


        <button
            class="categoria"
            onclick="abrirCatalogo('save')">
            Catálogo Save The Date
        </button>

    </div>

</section>



<!-- =========================
     CATÁLOGO
========================= -->

<section class="catalogo" id="catalogo">

    <button class="voltar" onclick="voltarCategorias()">
        ← &nbsp; VOLTAR ÀS CATEGORIAS
    </button>


    <div class="cabecalho-catalogo">

        <div
            class="categoria-titulo"
            id="tituloCategoria">
            CATÁLOGO • INFANTIL MENINO
        </div>


        <h2>
            Escolha seu convite
        </h2>


        <p>
            Conheça os modelos disponíveis e escolha
            a experiência que mais combina com esse
            momento tão especial.
        </p>

    </div>


    <div class="lista-convites">


        <!-- CONVITE HOMEM ARANHA -->

        <div
            class="convite-card"
            data-categoria="menino">

            <div class="convite-visual">

    <div class="celular">

        <div class="camera"></div>

        <div class="tela">

            <img
                id="imagemConvite"
                src="Homem Aranha _20261001_180828_0000.png"
                alt="Convite Homem Aranha">

            <video
                id="videoConvite"
                controls
                playsinline
                style="display:none;">
                <source
                    src="homem-aranha.mp4"
                    type="video/mp4">
            </video>

        </div>

    </div>


    <div class="visual-botoes">

        <button
            class="visual-btn ativo"
            onclick="mostrarImagem()">
            IMAGEM
        </button>

        <button
            class="visual-btn"
            onclick="mostrarVideo()">
            ▶ VÍDEO
        </button>

    </div>

            </div>


            <div class="convite-info">

                <span class="etiqueta">
                    CONVITE INTERATIVO
                </span>


                <h3>
                    Homem-Aranha
                </h3>


                <div class="recursos">

                    <p>
                        Design personalizado
                    </p>

                    <p>
                        Informações do evento
                    </p>

                    <p>
                        Botões interativos
                    </p>

                    <p>
                        Foto na capa opcional
                    </p>

                </div>


                <button
                    class="escolher"
                    onclick="escolherConvite('Homem-Aranha')">

                    ESCOLHER ESSE CONVITE

                </button>

            </div>

        </div>


    </div>

</section>



<script>

/* =========================
   CONFIGURAÇÃO
========================= */

/*
   Depois vamos colocar aqui
   o número oficial do WhatsApp.

   Formato:
   5516999999999
*/

const WHATSAPP = "SEUNUMERO";


/* =========================
   ABRIR WHATSAPP
========================= */
function mostrarImagem() {

    document.getElementById("imagemConvite").style.display = "block";

    document.getElementById("videoConvite").style.display = "none";

    document.querySelectorAll(".visual-btn")[0].classList.add("ativo");

    document.querySelectorAll(".visual-btn")[1].classList.remove("ativo");

    document.getElementById("videoConvite").pause();
}


function mostrarVideo() {

    document.getElementById("imagemConvite").style.display = "none";

    document.getElementById("videoConvite").style.display = "block";

    document.querySelectorAll(".visual-btn")[0].classList.remove("ativo");

    document.querySelectorAll(".visual-btn")[1].classList.add("ativo");
    }
function abrirWhatsAppGeral() {

    const mensagem =
        "Olá! Gostaria de conhecer os convites da Ayume.";

    window.open(
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(mensagem),
        "_blank"
    );
}


/* =========================
   ESCOLHER CONVITE
========================= */

function escolherConvite(nome) {

    const mensagem =
        "Olá! Gostaria de escolher o convite " +
        nome +
        " da Ayume Convites.";

    window.open(
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(mensagem),
        "_blank"
    );
}


/* =========================
   ABRIR CATÁLOGO
========================= */

function abrirCatalogo(categoria) {

    document.getElementById("home").style.display = "none";

    const catalogo =
        document.getElementById("catalogo");

    catalogo.classList.add("ativo");

    const titulo =
        document.getElementById("tituloCategoria");


    const nomes = {

        menina:
            "CATÁLOGO • INFANTIL MENINA",

        menino:
            "CATÁLOGO • INFANTIL MENINO",

        "15anos":
            "CATÁLOGO • 15 ANOS",

        adulto:
            "CATÁLOGO • ADULTO",

        fotos:
            "ÁLBUM DE FOTOS",

        save:
            "CATÁLOGO • SAVE THE DATE"

    };


    titulo.textContent =
        nomes[categoria] ||
        "CATÁLOGO • AYUME CONVITES";


    /* Mostra somente os convites daquela categoria */

    const convites =
        document.querySelectorAll(".convite-card");


    convites.forEach(function(convite) {

        if (
            convite.dataset.categoria === categoria
        ) {

            convite.style.display = "grid";

        } else {

            convite.style.display = "none";

        }

    });


    window.scrollTo(0, 0);
}


/* =========================
   VOLTAR
========================= */

function voltarCategorias() {

    document.getElementById("catalogo")
        .classList.remove("ativo");

    document.getElementById("home")
        .style.display = "flex";

    window.scrollTo(0, 0);
}

</script>

</body>
  </html>
